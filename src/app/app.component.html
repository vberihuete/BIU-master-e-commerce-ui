<!-- Navigation Menu -->
<nav class="bg-amber-600 p-4 shadow-md">
  <div class="container mx-auto flex justify-between items-center">
    <div class="nav-logo font-bold">Cafeteria Lulu</div>
    <div class="space-x-4">
      <a routerLink="/home" routerLinkActive="active" class="text-white hover:text-amber-200">Home</a>
      <a routerLink="/products" routerLinkActive="active" class="text-white hover:text-amber-200">Products</a>
      <a routerLink="/products" class="text-white hover:text-amber-200">Cart ({{cartCount$ | async}})</a>
      <ng-container *ngIf="isAdmin$ | async">
        <a routerLink="/configuration" routerLinkActive="active" class="text-white hover:text-amber-200">Configuration</a>
      </ng-container>
      <ng-container *ngIf="!(isAuthenticated$ | async)">
        <a routerLink="/login" routerLinkActive="active" class="text-white hover:text-amber-200">Login</a>
        <a routerLink="/register" routerLinkActive="active" class="text-white hover:text-amber-200">Register</a>
      </ng-container>
      <ng-container *ngIf="isAuthenticated$ | async">
        <span class="text-white">Welcome, {{(currentUser$ | async)?.username}}!</span>
        <button (click)="logout()" class="text-white hover:text-amber-200 cursor-pointer">Logout</button>
      </ng-container>
    </div>
  </div>
</nav>

<!-- Main Content -->
<div class="container mx-auto mt-6">
  <router-outlet></router-outlet>
</div>
