<!-- Floating Chat Button -->
<div class="chat-button" (click)="toggleChat()" [class.hidden]="isOpen">
  <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
  </svg>
  <span class="badge" *ngIf="messages.length > 1">{{ messages.length - 1 }}</span>
</div>

<!-- Chat Window -->
<div class="chat-window" [class.open]="isOpen">
  <!-- Chat Header -->
  <div class="chat-header">
    <div class="chat-header-info">
      <div class="chat-avatar">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="8" r="4"></circle>
          <path d="M6 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"></path>
        </svg>
      </div>
      <div>
        <h3>Cafeteria Lulu Bot</h3>
        <span class="status">Online</span>
      </div>
    </div>
    <div class="chat-header-actions">
      <button class="icon-btn" (click)="clearChat()" title="Clear chat">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="1 4 1 10 7 10"></polyline>
          <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path>
        </svg>
      </button>
      <button class="icon-btn close-btn" (click)="toggleChat()" title="Close chat">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>
  </div>

  <!-- Chat Messages -->
  <div class="chat-messages" #messagesContainer>
    <div *ngFor="let message of messages" 
         class="message" 
         [class.bot-message]="message.isBot"
         [class.user-message]="!message.isBot">
      <div class="message-content">
        <div class="message-bubble">
          {{ message.text }}
        </div>
        <span class="message-time">{{ formatTime(message.timestamp) }}</span>
      </div>
    </div>
  </div>

  <!-- Quick Suggestions -->
  <div class="quick-suggestions" *ngIf="messages.length === 1">
    <button (click)="userInput = 'What products do you have?'; sendMessage()">
      📋 Products
    </button>
    <button (click)="userInput = 'What are your hours?'; sendMessage()">
      🕒 Hours
    </button>
    <button (click)="userInput = 'How do I order?'; sendMessage()">
      🛒 How to Order
    </button>
  </div>

  <!-- Chat Input -->
  <div class="chat-input">
    <input 
      type="text" 
      [(ngModel)]="userInput" 
      (keypress)="handleKeyPress($event)"
      placeholder="Type your message..."
      [disabled]="!isOpen">
    <button (click)="sendMessage()" [disabled]="!userInput.trim()">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="22" y1="2" x2="11" y2="13"></line>
        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
      </svg>
    </button>
  </div>
</div>
