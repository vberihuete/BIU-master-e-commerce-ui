<h1 class="text-3xl font-bold text-center text-amber-800 mb-6">Our Products</h1>
<div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
  <div class="product-card bg-white rounded-lg shadow-md p-4 text-center" *ngFor="let product of products">
    <img [src]="product.imageUrl || product.image || 'assets/placeholder.jpg'" [alt]="product.name" class="h-40 w-full object-cover rounded-md mb-4">
    <div *ngIf="product.category" class="text-xs text-gray-500 mb-2">{{product.category}}</div>
    <h3 class="text-lg font-semibold text-gray-800">{{product.name}}</h3>
    <p *ngIf="product.description" class="text-sm text-gray-600 mb-2">{{product.description}}</p>
    <p class="text-amber-600 font-bold">${{product.price.toFixed(2)}}</p>
    <div *ngIf="product.stockQuantity !== undefined" class="text-xs text-gray-500 mt-1">
      Stock: {{product.stockQuantity}}
    </div>
    <button 
      (click)="addToCart(product)" 
      [disabled]="product.available === false || (product.stockQuantity !== undefined && product.stockQuantity <= 0)"
      class="mt-2 bg-amber-500 text-white px-4 py-2 rounded hover:bg-amber-600 disabled:bg-gray-400 disabled:cursor-not-allowed">
      {{product.available === false || (product.stockQuantity !== undefined && product.stockQuantity <= 0) ? 'Out of Stock' : 'Add to Cart'}}
    </button>
  </div>
</div>

<div class="cart bg-white rounded-lg shadow-md p-6 mt-8">
  <h2 class="text-2xl font-bold text-amber-800 mb-4">Shopping Cart</h2>
  <div *ngIf="(cart$ | async)?.length === 0" class="text-gray-600">Your cart is empty</div>
  <div class="cart-item flex justify-between items-center p-2 border-b" *ngFor="let item of cart$ | async">
    <span>{{item.name}} - ${{item.price.toFixed(2)}}</span>
    <button (click)="removeFromCart(item)" class="text-red-500 hover:text-red-700">Remove</button>
  </div>
  <p class="mt-4 text-xl font-bold text-amber-800">Total: ${{getTotal().toFixed(2)}}</p>
</div>
