<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <h1>Welcome Back</h1>
      <p>Sign in to your account to continue</p>
    </div>

    <!-- Alert Messages -->
    <div class="alerts-container" *ngIf="alerts.length > 0">
      <div 
        *ngFor="let alert of alerts" 
        class="alert"
        [ngClass]="'alert-' + alert.type"
        role="alert">
        <div class="alert-content">
          <span class="alert-message">{{ alert.message }}</span>
          <button 
            type="button" 
            class="alert-close" 
            (click)="removeAlert(alert)"
            aria-label="Close alert">
            &times;
          </button>
        </div>
      </div>
    </div>

    <!-- Login Form -->
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
      
      <div class="form-group">
        <label for="username">Username *</label>
        <input 
          type="text" 
          id="username"
          formControlName="username"
          class="form-control"
          [class.is-invalid]="username?.invalid && username?.touched"
          placeholder="Enter your username"
          autocomplete="username">
        <div class="invalid-feedback" *ngIf="username?.invalid && username?.touched">
          {{ getFieldError('username') }}
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password *</label>
        <input 
          type="password" 
          id="password"
          formControlName="password"
          class="form-control"
          [class.is-invalid]="password?.invalid && password?.touched"
          placeholder="Enter your password"
          autocomplete="current-password">
        <div class="invalid-feedback" *ngIf="password?.invalid && password?.touched">
          {{ getFieldError('password') }}
        </div>
      </div>

      <div class="form-actions">
        <button 
          type="submit" 
          class="btn btn-primary btn-lg"
          [disabled]="isSubmitting || isLoading"
          [class.loading]="isLoading">
          <span *ngIf="!isLoading">Sign In</span>
          <span *ngIf="isLoading" class="loading-spinner">
            <span class="spinner"></span>
            Signing In...
          </span>
        </button>
        
        <p class="form-footer">
          Don't have an account? <a routerLink="/register" class="link">Register here</a>
        </p>
      </div>
    </form>
  </div>
</div>
